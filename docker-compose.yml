services:
  api:
    build: .
    container_name: cttrains-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cttrains-dev}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    volumes:
      # Persist timetable snapshots between container restarts
      - snapshots:/app/.timetable-snapshots

  redis:
    image: redis:7-alpine
    container_name: cttrains-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-cttrains-dev}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cttrains-dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  snapshots:
